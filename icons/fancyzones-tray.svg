<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1d80b8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3238"/>
      <stop offset="100%" stop-color="#1b1e20"/>
    </linearGradient>
  </defs>
  <!-- Outer Display Frame -->
  <rect x="3" y="6" width="42" height="34" rx="5" ry="5" fill="url(#bgGrad)" stroke="#4e5861" stroke-width="1.5"/>
  <!-- Top Bar Display Line -->
  <line x1="3" y1="12" x2="45" y2="12" stroke="#3daee9" stroke-width="1" opacity="0.4"/>
  <!-- Left Zone -->
  <rect x="6" y="15" width="9" height="22" rx="2.5" ry="2.5" fill="#3a4047" stroke="#56606a" stroke-width="1"/>
  <!-- Center Main Priority Zone (Highlighted) -->
  <rect x="18" y="15" width="16" height="22" rx="2.5" ry="2.5" fill="url(#primaryGrad)" stroke="#68c5f8" stroke-width="1.2"/>
  <!-- Inner Window Preview in Center Zone -->
  <rect x="20.5" y="18" width="11" height="16" rx="1.5" ry="1.5" fill="#ffffff" opacity="0.25"/>
  <!-- Right Zone -->
  <rect x="37" y="15" width="5" height="22" rx="2" ry="2" fill="#3a4047" stroke="#56606a" stroke-width="1"/>
  <!-- Stand base -->
  <path d="M19 40 L29 40 L28 43 L20 43 Z" fill="#4e5861"/>
</svg>
